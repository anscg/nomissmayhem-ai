<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="stylesheet" href="styles/styles.css" onerror="console.error('Failed to load CSS')">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body id="noselect" style="background-color: black;">
    <div id="game-container">
        <div id="game-section">
            <div id="health-bar">
                <div id="health-bar-fill"></div>
            </div>
            <div id="stats-container">
                <div id="dash" class="ui-element">DASH READY!</div>
                <div id="money" class="ui-element"></div>
                <div id="timer" class="ui-element"></div>
            </div>
            <div id = "map"></div>
            <canvas id="gameCanvas" tabindex="0"></canvas>
            <canvas id="blurCanvas"></canvas>
        </div>  
    </div>

    
    <script>
        console.log('DOM loaded');
        console.log('GameCanvas:', document.getElementById('gameCanvas'));
        console.log('BlurCanvas:', document.getElementById('blurCanvas'));
    </script> 

    <script src="js/main.js" type="module" onerror="console.error('Failed to load main.js')"></script>
</body>
</html>
